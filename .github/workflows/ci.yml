name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres-test:
        image: postgres:17
        env:
          POSTGRES_USER: forgets_test
          POSTGRES_PASSWORD: forgets_test_dev_only
          POSTGRES_DB: forgets_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U forgets_test -d forgets_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FORGETS_DB_PASSWORD: forgets_test_dev_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run db:config
